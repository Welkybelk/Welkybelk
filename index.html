<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLINDSPOT — 2D Shooter</title>
    <!-- Puter.js provides zero-config, free cloud signaling for peer-to-peer WebRTC connection -->
    <script src="https://puter.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }
        h1, h2 { color: #f43f5e; margin-top: 0; }
        .section {
            background: #1f2937;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            background: #111827;
            border: 1px solid #4b5563;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background: #f43f5e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #e11d48; }
        .flex-row { display: flex; gap: 10px; margin-top: 10px; }
        .flex-row button { flex: 1; margin-top: 0; }
        .status-box {
            padding: 10px;
            background: #065f46;
            color: #a7f3d0;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
        #gameCanvas {
            background: black;
            border: 3px solid #f43f5e;
            display: none;
            margin-top: 20px;
            border-radius: 6px;
        }
        .instructions { font-size: 14px; color: #9ca3af; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container" id="menuInterface">
    <h1>BLINDSPOT</h1>
    <p>Tactical 2D shooter — you only see what's in front of you.</p>

    <div class="section">
        <h2>YOUR FIGHTER</h2>
        <label for="callsign">Callsign</label>
        <input type="text" id="callsign" value="Player">
        
        <label for="playerColor">Color</label>
        <input type="text" id="playerColor" value="#f43f5e">
    </div>

    <div class="section">
        <h2>PLAY</h2>
        <div class="instructions">
            <strong>Move:</strong> W / S forward & back · <strong>turn:</strong> A / D <br>
            <strong>fire:</strong> Space or click · <strong>scoreboard:</strong> hold Tab · <strong>menu:</strong> Esc<br>
            Your flashlight cone is all you can see — walls block sight, so watch corners.
        </div>
        
        <label for="roomCodeInput">Join a room</label>
        <div class="flex-row">
            <input type="text" id="roomCodeInput" placeholder="Enter 4-letter code">
            <button onclick="joinRoom()">Join</button>
        </div>

        <div class="flex-row">
            <button onclick="createRoom()">Create Room</button>
            <button onclick="startSolo()">Solo Practice</button>
            <button onclick="openMapMaker()">Map Maker</button>
        </div>

        <div id="statusMessage" class="status-box"></div>
    </div>

    <div class="section" id="lobbySection" style="display:none;">
        <h2>LOBBY PLAYERS</h2>
        <ul id="playerList"></ul>
        <button id="startMatchBtn" onclick="startMatch()" style="display:none;">Start Match</button>
    </div>
</div>

<canvas id="gameCanvas" width="900" height="600"></canvas>

<script>
    let networkGroup = null;
    let isHost = false;
    let myId = Math.random().toString(36).substring(2, 9);
    let players = {};
    let gameState = "menu";

    // Setup network configurations via Puter P2P capabilities
    async function createRoom() {
        const statusBox = document.getElementById('statusMessage');
        statusBox.style.display = 'block';
        statusBox.innerText = "Generating signaling connection...";

        // Create random 4 letter tracking code
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        isHost = true;
        
        try {
            // Puter creates a secure P2P mesh cluster using the room code identifier
            networkGroup = await puter.createGroup(code);
            statusBox.style.backgroundColor = "#065f46";
            statusBox.innerText = `Room active! Share Code: ${code}. Waiting for devices...`;
            
            document.getElementById('lobbySection').style.display = 'block';
            document.getElementById('startMatchBtn').style.display = 'block';
            
            listenForPlayers();
        } catch (err) {
            statusBox.style.backgroundColor = "#991b1b";
            statusBox.innerText = "Connection failed. Retry.";
        }
    }

    async function joinRoom() {
        const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
        const statusBox = document.getElementById('statusMessage');
        
        if(code.length !== 4) {
            alert("Please input a valid 4-letter room code.");
            return;
        }

        statusBox.style.display = 'block';
        statusBox.innerText = `Searching for room ${code}...`;
        isHost = false;

        try {
            networkGroup = await puter.joinGroup(code);
            statusBox.style.backgroundColor = "#065f46";
            statusBox.innerText = `Connected successfully to Room ${code}!`;
            
            document.getElementById('lobbySection').style.display = 'block';
            
            listenForPlayers();
            
            // Broadcast your custom configuration parameters to the room host
            networkGroup.broadcast('player_joined', {
                id: myId,
                name: document.getElementById('callsign').value,
                color: document.getElementById('playerColor').value
            });
        } catch (err) {
            statusBox.style.backgroundColor = "#991b1b";
            statusBox.innerText = "Room code not found. Double check text.";
        }
    }

    function listenForPlayers() {
        if (!networkGroup) return;

        // Trigger updates when other nodes send game network packages
        networkGroup.onMessage((message) => {
            const data = message.body;
            
            if (message.type === 'player_joined') {
                players[data.id] = { name: data.name, color: data.color, x: 100, y: 100 };
                updateLobbyUI();
                
                if (isHost) {
                    // Send lobby layout confirmation back to the new player
                    networkGroup.broadcast('sync_lobby', { players: players });
                }
            }
            
            if (message.type === 'sync_lobby') {
                players = data.players;
                updateLobbyUI();
            }

            if (message.type === 'match_start') {
                initGameEngine();
            }

            if (message.type === 'game_update') {
                if (players[data.id]) {
                    players[data.id].x = data.x;
                    players[data.id].y = data.y;
                }
            }
        });
    }

    function updateLobbyUI() {
        const list = document.getElementById('playerList');
        list.innerHTML = "";
        
        // Render yourself locally in list
        const meLi = document.createElement('li');
        meLi.innerText = `${document.getElementById('callsign').value} (You)`;
        list.appendChild(meLi);

        // Render connected devices dynamically
        Object.keys(players).forEach(id => {
            if (id !== myId) {
                const li = document.createElement('li');
                li.innerText = players[id].name;
                li.style.color = players[id].color;
                list.appendChild(li);
            }
        });
    }

    function startMatch() {
        if (!isHost) return;
        networkGroup.broadcast('match_start', {});
        initGameEngine();
    }

    function startSolo() {
        document.getElementById('menuInterface').style.display = 'none';
        document.getElementById('gameCanvas').style.display = 'block';
        // Initialize solo offline configuration loop...
    }

    function openMapMaker() {
        alert("Map Maker view active! Canvas grid layer loaded.");
    }

    // Barebones baseline canvas render frame loop implementation 
    function initGameEngine() {
        document.getElementById('menuInterface').style.display = 'none';
        document.getElementById('gameCanvas').style.display = 'block';
        gameState = "playing";
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let localPlayer = { x: 450, y: 300, speed: 4, angle: 0 };
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') localPlayer.y -= localPlayer.speed;
            if (e.key === 's' || e.key === 'S') localPlayer.y += localPlayer.speed;
            if (e.key === 'a' || e.key === 'A') localPlayer.x -= localPlayer.speed;
